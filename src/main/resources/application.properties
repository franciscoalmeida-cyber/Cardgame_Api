spring.application.name=cardgame-api
server.port=8080

# H2 em memoria (troque por jdbc:h2:file:./data/cartasdb para persistir em arquivo)
spring.datasource.url=jdbc:h2:mem:cartasdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza a tabela automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Popula algumas cartas ao iniciar (desligue com false)
app.seed.enabled=true
